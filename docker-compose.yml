services:
  mysql:
    image: mysql:8.0
    container_name: dexa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rahasia}
      MYSQL_DATABASE: ${DB_DATABASE:-dexa}
    ports:
      - "${MYSQL_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rahasia}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dexa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dexa-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rahasia}
      DB_DATABASE: ${DB_DATABASE:-dexa}
      JWT_SECRET: ${JWT_SECRET:-super_dexa_secret_key_2026}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dexa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dexa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - dexa-network

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  dexa-network:
    driver: bridge
